<svg viewBox="0 0 640 480" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ev-title ev-desc" preserveAspectRatio="xMidYMid meet">
  <title id="ev-title">Embedded Systems and VLSI</title>
  <desc id="ev-desc">An animated microcontroller, sensor, actuator, silicon wafer and transistor structures representing Embedded Systems and VLSI.</desc>
  <defs>
    <linearGradient id="ev-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ev-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="ev-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE169"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="ev-halo">
      <stop offset="0" stop-color="#22C55E" stop-opacity=".24"/>
      <stop offset=".65" stop-color="#22C55E" stop-opacity=".07"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ev-wafer-clip">
      <circle cx="516" cy="235" r="70"/>
    </clipPath>
    <filter id="ev-shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#111827" flood-opacity=".16"/>
    </filter>
    <filter id="ev-glow-green" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ev-glow-gold" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ev-core{transform-box:fill-box;transform-origin:center;animation:ev-float 3.4s ease-in-out infinite}
      .ev-mcu{transform-box:fill-box;transform-origin:center;animation:ev-float 3s .2s ease-in-out infinite}
      .ev-wafer{transform-box:fill-box;transform-origin:center;animation:ev-wafer-float 4s ease-in-out infinite}
      .ev-wafer-grid{transform-box:fill-box;transform-origin:center;animation:ev-spin 22s linear infinite}
      .ev-rotor{transform-box:fill-box;transform-origin:center;animation:ev-spin 2.8s linear infinite}
      .ev-flow{stroke-dasharray:8 11;animation:ev-flow 1.5s linear infinite}
      .ev-flow-r{stroke-dasharray:7 10;animation:ev-flow-r 1.7s linear infinite}
      .ev-wave-1,.ev-wave-2,.ev-wave-3{transform-box:view-box;transform-origin:100px 202px}
      .ev-wave-1{animation:ev-wave 1.8s ease-out infinite}
      .ev-wave-2{animation:ev-wave 1.8s .4s ease-out infinite}
      .ev-wave-3{animation:ev-wave 1.8s .8s ease-out infinite}
      .ev-pulse{transform-box:fill-box;transform-origin:center;animation:ev-pulse 1.5s ease-in-out infinite}
      .ev-die{animation:ev-die 1.6s ease-in-out infinite}
      .ev-gate-a{animation:ev-gate 1.8s ease-in-out infinite}
      .ev-gate-b{animation:ev-gate 1.8s .35s ease-in-out infinite}
      .ev-gate-c{animation:ev-gate 1.8s .7s ease-in-out infinite}
      .ev-particle-a{animation:ev-particle-a 3s ease-in-out infinite}
      .ev-particle-b{animation:ev-particle-b 3.5s .5s ease-in-out infinite}
      .ev-particle-c{animation:ev-particle-c 4s 1s ease-in-out infinite}
      .ev-ambient-flow{stroke-dasharray:6 10;animation:ev-ambient-flow 4s linear infinite}
      .ev-ambient-flow-r{stroke-dasharray:5 9;animation:ev-ambient-flow-r 4.6s linear infinite}
      .ev-ambient-breathe{transform-box:fill-box;transform-origin:center;animation:ev-ambient-breathe 3.4s ease-in-out infinite}
      .ev-ambient-orbit{transform-box:fill-box;transform-origin:center;animation:ev-spin 32s linear infinite}
      @keyframes ev-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      @keyframes ev-wafer-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
      @keyframes ev-spin{to{transform:rotate(360deg)}}
      @keyframes ev-flow{to{stroke-dashoffset:-38}}
      @keyframes ev-flow-r{to{stroke-dashoffset:36}}
      @keyframes ev-wave{0%{opacity:0;transform:scale(.84)}45%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
      @keyframes ev-pulse{0%,100%{opacity:.55;transform:scale(.86)}50%{opacity:1;transform:scale(1.2)}}
      @keyframes ev-die{0%,100%{opacity:.55}50%{opacity:1;filter:drop-shadow(0 0 9px #FFC400)}}
      @keyframes ev-gate{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes ev-particle-a{0%,100%{transform:translate(0);opacity:.25}50%{transform:translate(8px,-14px);opacity:1}}
      @keyframes ev-particle-b{0%,100%{transform:translate(0);opacity:.25}50%{transform:translate(-9px,-16px);opacity:.9}}
      @keyframes ev-particle-c{0%,100%{transform:translate(0);opacity:.3}50%{transform:translate(7px,-12px);opacity:1}}
      @keyframes ev-ambient-flow{to{stroke-dashoffset:-48}}
      @keyframes ev-ambient-flow-r{to{stroke-dashoffset:46}}
      @keyframes ev-ambient-breathe{0%,100%{opacity:.1;transform:scale(.96)}50%{opacity:.22;transform:scale(1.04)}}
      @media(prefers-reduced-motion:reduce){
        .ev-core,.ev-mcu,.ev-wafer,.ev-wafer-grid,.ev-rotor,.ev-flow,.ev-flow-r,.ev-wave-1,.ev-wave-2,.ev-wave-3,.ev-pulse,.ev-die,.ev-gate-a,.ev-gate-b,.ev-gate-c,.ev-particle-a,.ev-particle-b,.ev-particle-c,.ev-ambient-flow,.ev-ambient-flow-r,.ev-ambient-breathe,.ev-ambient-orbit{animation:none}
      }
    </style>
  </defs>
  <circle cx="320" cy="240" r="225" fill="url(#ev-halo)"/>
